```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Way Driving Academy</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

:root{
--primary:#0077b6;
--secondary:#1a659e;
--light:#caf0f8;
--accent:#ff7b54;
--dark:#0b2545;
--white:#ffffff;
--gray:#f7fafc;
}

body{
font-family:'Poppins',sans-serif;
background:#fff;
color:var(--dark);
line-height:1.7;
overflow-x:hidden;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

section{
padding:100px 0;
}

h1,h2,h3,h4{
line-height:1.2;
}

img{
max-width:100%;
display:block;
}

.btn{
display:inline-block;
padding:16px 36px;
background:var(--accent);
color:white;
text-decoration:none;
border-radius:50px;
font-weight:700;
transition:.3s;
box-shadow:0 10px 30px rgba(255,123,84,.35);
}

.btn:hover{
transform:translateY(-4px);
}

.section-title{
text-align:center;
margin-bottom:60px;
}

.section-title h2{
font-size:2.8rem;
color:var(--secondary);
margin-bottom:15px;
}

.section-title p{
max-width:700px;
margin:auto;
color:#5b6777;
}

header{
position:sticky;
top:0;
z-index:999;
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
box-shadow:0 2px 20px rgba(0,0,0,.05);
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo img{
width:60px;
height:60px;
border-radius:15px;
object-fit:cover;
}

.logo h3{
color:var(--secondary);
font-size:1.1rem;
}

.nav-links{
display:flex;
gap:30px;
}

.nav-links a{
text-decoration:none;
color:var(--dark);
font-weight:500;
transition:.3s;
}

.nav-links a:hover{
color:var(--primary);
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
background:
linear-gradient(
135deg,
rgba(202,240,248,.9),
rgba(255,255,255,1)
);
}

.hero-content{
display:grid;
grid-template-columns:1fr 1fr;
gap:70px;
align-items:center;
}

.hero-text span{
display:inline-block;
padding:10px 18px;
background:var(--light);
border-radius:50px;
font-weight:600;
margin-bottom:20px;
color:var(--secondary);
}

.hero-text h1{
font-size:4rem;
margin-bottom:25px;
color:var(--secondary);
}

.hero-text p{
font-size:1.1rem;
margin-bottom:35px;
max-width:550px;
}

.hero-buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.secondary-btn{
display:inline-block;
padding:16px 36px;
border:2px solid var(--primary);
border-radius:50px;
text-decoration:none;
font-weight:700;
color:var(--primary);
}

.hero-image img{
border-radius:30px;
box-shadow:0 25px 60px rgba(0,0,0,.15);
}

.stats{
background:var(--primary);
color:white;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:30px;
text-align:center;
}

.stat h2{
font-size:3rem;
margin-bottom:10px;
}

.problem{
background:var(--gray);
}

.problem-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.problem-card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.05);
transition:.3s;
}

.problem-card:hover{
transform:translateY(-10px);
}

.problem-icon{
font-size:2.5rem;
margin-bottom:20px;
}

.problem-card h3{
margin-bottom:15px;
color:var(--secondary);
}

.benefits-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.benefit-card{
background:white;
padding:35px;
border-radius:25px;
border:1px solid #e8eef5;
transition:.3s;
}

.benefit-card:hover{
transform:translateY(-8px);
border-color:var(--primary);
}

.benefit-icon{
width:70px;
height:70px;
background:var(--light);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:1.8rem;
margin-bottom:20px;
}

.benefit-card h3{
margin-bottom:15px;
color:var(--secondary);
}

.features{
background:var(--gray);
}

.steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
}

.step{
background:white;
padding:35px;
border-radius:25px;
text-align:center;
position:relative;
}

.step-number{
width:70px;
height:70px;
background:var(--primary);
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:1.4rem;
font-weight:700;
margin:0 auto 20px;
}

.step h3{
margin-bottom:10px;
color:var(--secondary);
}

.testimonials{
background:white;
}

.testimonial-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.testimonial{
background:var(--gray);
padding:35px;
border-radius:25px;
}

.stars{
font-size:1.2rem;
margin-bottom:15px;
color:#ffb703;
}

.testimonial h4{
margin-top:20px;
color:var(--secondary);
}

.offer{
background:
linear-gradient(
135deg,
var(--secondary),
var(--primary)
);
color:white;
}

.offer-box{
background:rgba(255,255,255,.08);
padding:60px;
border-radius:35px;
text-align:center;
backdrop-filter:blur(10px);
max-width:900px;
margin:auto;
}

.old-price{
text-decoration:line-through;
font-size:1.3rem;
opacity:.7;
}

.new-price{
font-size:4rem;
font-weight:800;
margin:15px 0;
}

.offer-list{
margin:30px 0;
}

.offer-list p{
color:white;
margin:10px 0;
}

.offer .btn{
background:white;
color:var(--primary);
}

```
